data:
  os:
    root_dir: data/legacy_misc/os_abide_cc200_control_base
    timeseries_dir: data/legacy_misc/os_abide_cc200_control_base/timeseries
    nifti_manifest: ""
    tr: 0.72
    subjects_limit: 80
    states: [vis, sommot, dorsattn, salventattn, limbic, cont, default]
    atlas_nodes_primary: 200
    atlas_nodes_secondary: 200
    window_len: 64
    stride: 16
    train_ratio: 0.7
    val_ratio: 0.15
    random_seed: 42
    nuisance_strategy: none
    nuisance_include_compcor: false
    nuisance_compcor_components: 0
    nuisance_include_gsr: false
    nuisance_add_derivatives: false
    nuisance_add_quadratic: false
    nuisance_detrend: false
    nuisance_high_pass: 0.0
    nuisance_low_pass: 0.0
  etth1:
    csv_path: data/reference_raw/ETTh1.csv
    target_col: OT
    seq_len: 96
    pred_len: 24
    train_ratio: 0.7
    val_ratio: 0.15

template:
  atlas_name: custom
  atlas_nodes_options: [200]
  sparsity_levels: [0.2]
  default_sparsity: 0.2
  threshold_mode: proportional
  fisher_z_average: true
  output_name: template_bank.npz

model:
  arch: mobse
  hidden_dim: 64
  num_nodes: 200
  num_graph_layers: 2
  dropout: 0.1
  num_experts: 7
  routing_k: 2
  routing_mode: soft
  os_num_classes: 7
  etth1_in_dim: 7
  etth1_out_dim: 1
  sparse_attn_window: 16
  use_template_prior: true
  template_bank_path: ""
  os_windows_path: ""

train:
  tasks: [os]
  batch_size: 32
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  seeds: [42]
  os_loss_weight: 1.0
  etth1_loss_weight: 1.0
  etth1_loss_type: huber
  etth1_huber_delta: 1.0
  normalize_task_losses: false
  task_loss_norm_batches: 4
  selection_metric: weighted_normalized_loss
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0005
  use_amp: false
  device: cuda

eval:
  metrics: [accuracy, f1, mae, mse]
  profile_batches: 10
  latency_warmup: 3
  output_prefix: eval

artifacts:
  root_dir: artifacts
  run_id: "abide_control_cc200_mobse_base_20260330"
