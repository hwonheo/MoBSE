[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobse"
version = "0.1.0"
description = "Mixture of Brain-State Experts PoC"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "MoBSE Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "PyYAML>=6.0",
  "torch>=2.0",
  "torch-geometric>=2.4",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.13",
]

[project.optional-dependencies]
neuro = ["nilearn>=0.11", "nibabel>=5.0"]
profile = ["thop>=0.1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
mobse = "mobse.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["mobse*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
